<svg viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mhTitle">
  <title id="mhTitle">Illustration representing balanced mental wellness</title>
  <defs>
    <linearGradient id="mhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="180" r="150" fill="#F8FAFC"/>
  <circle cx="200" cy="180" r="150" fill="none" stroke="#E5E7EB" stroke-width="1"/>

  <!-- head silhouette -->
  <path d="M200 90 C260 90 290 140 285 190 C282 215 268 232 255 240 L255 275 L145 275 L145 240
           C132 232 118 215 115 190 C110 140 140 90 200 90 Z" fill="url(#mhGrad)" fill-opacity="0.12" stroke="url(#mhGrad)" stroke-width="2.5"/>

  <!-- balance leaves / calm waves inside head -->
  <path d="M140 175 Q170 150 200 175 Q230 200 260 175" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 205 Q175 188 200 205 Q225 222 250 205" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linecap="round"/>

  <!-- floating leaf / growth accent -->
  <path d="M200 90 C205 65 230 55 250 60 C245 82 225 95 200 90 Z" fill="#22C55E" fill-opacity="0.7"/>

  <!-- pulse line at base -->
  <path d="M60 300 H150 L165 280 L180 320 L195 290 L210 305 H340" fill="none" stroke="url(#mhGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
