<svg viewBox="0 0 560 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of an AI network analyzing mental wellness data</title>
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="heroGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="heroGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="280" cy="260" r="220" fill="url(#heroGrad2)"/>

  <g id="orbit-outer">
    <circle cx="280" cy="260" r="190" fill="none" stroke="#2563EB" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="2 10"/>
  </g>
  <g id="orbit-inner">
    <circle cx="280" cy="260" r="140" fill="none" stroke="#0EA5E9" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="1 8"/>
  </g>

  <!-- central card: score dial -->
  <g filter="url(#heroGlow)">
    <rect x="170" y="150" width="220" height="220" rx="28" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="170" y="150" width="220" height="220" rx="28" fill="none" stroke="url(#heroGrad1)" stroke-width="2"/>
  </g>
  <circle cx="280" cy="260" r="78" fill="none" stroke="#E5E7EB" stroke-width="14"/>
  <circle cx="280" cy="260" r="78" fill="none" stroke="url(#heroGrad1)" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="120"
          transform="rotate(-90 280 260)"/>
  <text x="280" y="252" text-anchor="middle" font-family="Poppins, sans-serif" font-size="42" font-weight="600" fill="#0F172A">81</text>
  <text x="280" y="278" text-anchor="middle" font-family="Poppins, sans-serif" font-size="13" fill="#64748B">wellness score</text>

  <!-- floating data nodes -->
  <g font-family="Poppins, sans-serif">
    <circle cx="95" cy="150" r="8" fill="#3B82F6"/>
    <circle cx="95" cy="150" r="16" fill="#3B82F6" fill-opacity="0.15"/>
    <line x1="103" y1="155" x2="185" y2="200" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="1.5"/>

    <circle cx="460" cy="130" r="7" fill="#0EA5E9"/>
    <circle cx="460" cy="130" r="15" fill="#0EA5E9" fill-opacity="0.15"/>
    <line x1="453" y1="136" x2="375" y2="195" stroke="#0EA5E9" stroke-opacity="0.35" stroke-width="1.5"/>

    <circle cx="80" cy="370" r="9" fill="#22C55E"/>
    <circle cx="80" cy="370" r="17" fill="#22C55E" fill-opacity="0.15"/>
    <line x1="90" y1="365" x2="182" y2="320" stroke="#22C55E" stroke-opacity="0.35" stroke-width="1.5"/>

    <circle cx="470" cy="380" r="7" fill="#2563EB"/>
    <circle cx="470" cy="380" r="15" fill="#2563EB" fill-opacity="0.15"/>
    <line x1="463" y1="375" x2="378" y2="325" stroke="#2563EB" stroke-opacity="0.35" stroke-width="1.5"/>

    <rect x="52" y="230" width="66" height="30" rx="9" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="85" y="249" text-anchor="middle" font-size="12" fill="#0F172A">Sleep</text>

    <rect x="440" y="240" width="80" height="30" rx="9" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="480" y="259" text-anchor="middle" font-size="12" fill="#0F172A">Screen time</text>

    <rect x="60" y="300" width="66" height="30" rx="9" fill="#ffffff" stroke="#E5E7EB"/>
    <text x="93" y="319" text-anchor="middle" font-size="12" fill="#0F172A">Activity</text>
  </g>
</svg>
